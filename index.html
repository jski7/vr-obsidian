<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🧠 VR Brain Map</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#020818; overflow:hidden; font-family:system-ui,sans-serif; color:#fff; }

    #overlay {
      position:fixed; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#020818; z-index:99; transition:opacity .8s;
    }
    #overlay h1 {
      font-size:2.8rem; font-weight:900; letter-spacing:.05em;
      background:linear-gradient(135deg,#00e5ff,#aa00ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    #overlay p { color:#4a6080; margin:.5rem 0 1.6rem; font-size:.95rem; }
    #bar { width:280px; height:4px; background:#0d1a30; border-radius:4px; overflow:hidden; }
    #fill { height:100%; background:linear-gradient(90deg,#00e5ff,#aa00ff); width:0%; transition:width .3s; }
    #status { color:#334455; font-size:.78rem; margin-top:.6rem; }

    #hud {
      position:fixed; top:14px; left:14px;
      pointer-events:none; font-size:12px; color:rgba(255,255,255,.5);
      line-height:1.6;
    }
    #hud strong { display:block; color:#00e5ff; font-size:15px; font-weight:700; margin-bottom:2px; }

    #legend {
      position:fixed; top:14px; right:14px;
      pointer-events:none; font-size:11px; color:rgba(255,255,255,.6);
    }
    .li { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
    .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

    #info {
      position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
      background:rgba(2,8,24,.93);
      border:1px solid rgba(0,229,255,.2);
      border-radius:11px; padding:11px 20px; min-width:200px; text-align:center;
      display:none; pointer-events:none;
      box-shadow:0 0 28px rgba(0,229,255,.1);
    }
    #info .n { font-size:1.05rem; font-weight:700; color:#00e5ff; }
    #info .f { font-size:.73rem; color:#607080; margin-top:3px; }

    #hint {
      position:fixed; bottom:14px; right:14px;
      font-size:10px; color:rgba(80,120,160,.45);
      pointer-events:none; text-align:right; line-height:1.8;
    }

    /* ── Note content panel ── */
    #note-panel {
      position:fixed; bottom:0; left:0; right:0;
      height:42vh; background:rgba(2,8,24,.97);
      border-top:1px solid rgba(0,229,255,.25);
      transform:translateY(100%);
      transition:transform .35s cubic-bezier(.4,0,.2,1);
      z-index:50; display:flex; flex-direction:column;
      box-shadow:0 -8px 40px rgba(0,0,0,.6);
    }
    #note-panel.open { transform:translateY(0); }
    #note-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 18px 8px; border-bottom:1px solid rgba(0,229,255,.1);
      flex-shrink:0;
    }
    #note-title { font-size:1rem; font-weight:700; color:#00e5ff; }
    #note-close {
      cursor:pointer; color:rgba(255,255,255,.4); font-size:1.3rem;
      line-height:1; border:none; background:none; padding:4px 8px;
      transition:color .2s;
    }
    #note-close:hover { color:#fff; }
    #note-body {
      overflow-y:auto; padding:14px 18px 18px;
      font-size:.82rem; line-height:1.7; color:rgba(255,255,255,.75);
      flex:1;
    }
    #note-body h1,#note-body h2,#note-body h3 {
      color:#00e5ff; margin:.8em 0 .3em; font-size:.95rem;
    }
    #note-body h1 { font-size:1.1rem; }
    #note-body code {
      background:rgba(0,229,255,.08); border-radius:4px;
      padding:1px 5px; font-size:.8rem; color:#88ddff;
    }
    #note-body pre { background:rgba(0,0,0,.4); border-radius:6px; padding:10px 14px; overflow-x:auto; margin:.5em 0; }
    #note-body pre code { background:none; padding:0; }
    #note-body a { color:#aa88ff; }
    #note-body strong { color:#fff; }
    #note-body em { color:rgba(255,255,255,.6); }
    #note-body ul,#note-body ol { padding-left:1.4em; }
    #note-body blockquote { border-left:3px solid rgba(0,229,255,.3); padding-left:10px; color:rgba(255,255,255,.5); }
    #note-body hr { border:none; border-top:1px solid rgba(255,255,255,.1); margin:.8em 0; }

    /* VR Button override */
    #VRButton {
      position:fixed !important; bottom:22px !important; left:14px !important;
      transform:none !important;
    }

    /* ── Password gate ── */
    #pw-gate {
      position:fixed; inset:0; z-index:999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#020818;
    }
    #pw-gate h2 {
      font-size:2rem; font-weight:900; letter-spacing:.08em;
      background:linear-gradient(135deg,#00e5ff,#aa00ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:2rem;
    }
    #pw-wrap {
      display:flex; gap:10px; align-items:center;
    }
    #pw-input {
      background:rgba(255,255,255,.06); border:1px solid rgba(0,229,255,.3);
      color:#fff; font-size:1.5rem; text-align:center; letter-spacing:.4em;
      padding:.5rem 1.2rem; border-radius:10px; outline:none; width:160px;
      transition:border-color .2s;
    }
    #pw-input:focus { border-color:#00e5ff; }
    #pw-btn {
      background:linear-gradient(135deg,#00e5ff22,#aa00ff22);
      border:1px solid rgba(0,229,255,.4); color:#00e5ff;
      font-size:1rem; font-weight:700; padding:.55rem 1.3rem;
      border-radius:10px; cursor:pointer; transition:all .2s;
    }
    #pw-btn:hover { background:rgba(0,229,255,.15); }
    #pw-err { color:#ff4466; font-size:.85rem; margin-top:.9rem; min-height:1.2em; }
  </style>
</head>
<body>

<div id="pw-gate">
  <h2>🧠 VR BRAIN</h2>
  <div id="pw-wrap">
    <input id="pw-input" type="password" placeholder="••••" maxlength="20" autofocus />
    <button id="pw-btn">Enter</button>
  </div>
  <div id="pw-err"></div>
</div>


<div id="overlay">
  <h1>🧠 VR BRAIN</h1>
  <p>Loading your knowledge graph…</p>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Initialising…</div>
</div>

<div id="hud">
  <strong>🧠 VR BRAIN MAP</strong>
  <span id="stats"></span>
</div>

<div id="legend"></div>

<div id="info">
  <div class="n" id="iname">—</div>
  <div class="f" id="ipath">—</div>
</div>

<div id="hint">
  Desktop: drag · scroll · click node to read<br>
  Quest VR: L-stick = move · R-stick Y = fly · Trigger = read note · Both pinch = zoom · R-pinch = grab
</div>

<!-- Note content panel -->
<div id="note-panel">
  <div id="note-header">
    <div id="note-title">—</div>
    <button id="note-close">✕</button>
  </div>
  <div id="note-body"></div>
</div>


<script>
(function() {
  const PASS = '9';
  const gate = document.getElementById('pw-gate');
  const input = document.getElementById('pw-input');
  const btn   = document.getElementById('pw-btn');
  const err   = document.getElementById('pw-err');

  function attempt() {
    if (input.value === PASS) {
      gate.style.transition = 'opacity .6s';
      gate.style.opacity = '0';
      setTimeout(() => gate.remove(), 650);
    } else {
      err.textContent = 'Incorrect password';
      input.value = '';
      input.focus();
      setTimeout(() => { err.textContent = ''; }, 2000);
    }
  }

  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// Imports
// ─────────────────────────────────────────────────────────────────────────────
import * as THREE          from 'https://esm.sh/three@0.153.0';
import { VRButton }        from 'https://esm.sh/three@0.153.0/examples/jsm/webxr/VRButton.js';
import { OrbitControls }   from 'https://esm.sh/three@0.153.0/examples/jsm/controls/OrbitControls.js';
import { XRHandModelFactory } from 'https://esm.sh/three@0.153.0/examples/jsm/webxr/XRHandModelFactory.js';

// ─────────────────────────────────────────────────────────────────────────────
// Progress helper
// ─────────────────────────────────────────────────────────────────────────────
const prog = (pct, msg) => {
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('status').textContent = msg;
};

// ─────────────────────────────────────────────────────────────────────────────
// Folder → colour
// ─────────────────────────────────────────────────────────────────────────────
const PALETTE = {
  CLUE:     0x00ffff,
  HOME:     0x39ff14,
  PHYSICAL: 0xff6600,
  XVY:      0xff00ff,
  FINANCE:  0xffe600,
  AI:       0x00b4ff,
};
const folderClr = f => PALETTE[f?.toUpperCase()] ?? 0x889aaa;

// ─────────────────────────────────────────────────────────────────────────────
// Renderer + scene
// ─────────────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020818);
scene.fog = new THREE.FogExp2(0x020818, 0.005);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 800);
camera.position.set(0, 4, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer, {
  optionalFeatures: ['hand-tracking', 'local-floor'],
}));

// ─────────────────────────────────────────────────────────────────────────────
// Lighting
// ─────────────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x223366, 4));
const sunLight = new THREE.DirectionalLight(0x88aaff, 2);
sunLight.position.set(30, 50, 10);
scene.add(sunLight);
const accentLight = new THREE.PointLight(0xaa00ff, 1.5, 120, 2);
scene.add(accentLight);

// ─────────────────────────────────────────────────────────────────────────────
// Stars
// ─────────────────────────────────────────────────────────────────────────────
{
  const n = 3000;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 600;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.22, sizeAttenuation: true })));
}

// ─────────────────────────────────────────────────────────────────────────────
// World group
// ─────────────────────────────────────────────────────────────────────────────
const world = new THREE.Group();
scene.add(world);

// ─────────────────────────────────────────────────────────────────────────────
// Desktop orbit controls
// ─────────────────────────────────────────────────────────────────────────────
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.06;
orbit.target.set(0, 0, 0);

// ─────────────────────────────────────────────────────────────────────────────
// Text sprite helper
// ─────────────────────────────────────────────────────────────────────────────
function makeLabel(text, hexCol) {
  const cv  = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const fs  = 36;
  ctx.font = `bold ${fs}px Arial`;
  cv.width  = Math.ceil(ctx.measureText(text).width) + 26;
  cv.height = fs + 16;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(2,8,28,.82)';
  if (ctx.roundRect) ctx.roundRect(0, 0, cv.width, cv.height, 7);
  else ctx.rect(0, 0, cv.width, cv.height);
  ctx.fill();
  const r = (hexCol >> 16) & 255, g = (hexCol >> 8) & 255, b = hexCol & 255;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.font = `bold ${fs}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cv.width / 2, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  spr.scale.set((cv.width / cv.height) * 2.2, 2.2, 1);
  return spr;
}

// ─────────────────────────────────────────────────────────────────────────────
// 3-D force-directed layout
// ─────────────────────────────────────────────────────────────────────────────
function forceLayout(nodes, links, steps = 280) {
  const pos = {}, vel = {};
  nodes.forEach(n => {
    const θ = Math.random() * Math.PI * 2;
    const φ = Math.acos(2 * Math.random() - 1);
    const r = 14 + Math.random() * 16;
    pos[n.id] = new THREE.Vector3(
      r * Math.sin(φ) * Math.cos(θ),
      r * Math.sin(φ) * Math.sin(θ),
      r * Math.cos(φ)
    );
    vel[n.id] = new THREE.Vector3();
  });

  const tmp = new THREE.Vector3();
  for (let it = 0; it < steps; it++) {
    const F = {};
    nodes.forEach(n => { F[n.id] = new THREE.Vector3(); });

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        tmp.copy(pos[nodes[i].id]).sub(pos[nodes[j].id]);
        const d = Math.max(tmp.length(), 0.5);
        tmp.normalize().multiplyScalar(110 / (d * d));
        F[nodes[i].id].add(tmp);
        F[nodes[j].id].sub(tmp);
      }
    }

    links.forEach(l => {
      if (!pos[l.source] || !pos[l.target]) return;
      tmp.copy(pos[l.target]).sub(pos[l.source]);
      const d = tmp.length();
      tmp.normalize().multiplyScalar(0.04 * d);
      F[l.source].add(tmp);
      F[l.target].sub(tmp);
    });

    nodes.forEach(n => { F[n.id].addScaledVector(pos[n.id], -0.007); });
    nodes.forEach(n => {
      vel[n.id].add(F[n.id]).multiplyScalar(0.83);
      pos[n.id].add(vel[n.id]);
    });
  }
  return pos;
}

// ─────────────────────────────────────────────────────────────────────────────
// Build scene from graph data
// ─────────────────────────────────────────────────────────────────────────────
let nodeMeshes = [];
let selected = null;
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
const infoEl    = document.getElementById('info');

async function buildScene(graphData) {
  // Clear existing world content
  while (world.children.length) world.remove(world.children[0]);
  nodeMeshes = [];
  selected = null;

  const { nodes, links } = graphData;

  const deg = {};
  nodes.forEach(n => { deg[n.id] = 0; });
  links.forEach(l => {
    deg[l.source] = (deg[l.source] || 0) + 1;
    deg[l.target] = (deg[l.target] || 0) + 1;
  });

  const positions = forceLayout(nodes, links);

  const matCache = {};
  function getMat(col) {
    if (!matCache[col]) {
      matCache[col] = new THREE.MeshStandardMaterial({
        color: col, emissive: col, emissiveIntensity: 0.45,
        roughness: 0.25, metalness: 0.65,
      });
    }
    return matCache[col];
  }

  nodes.forEach((node, idx) => {
    const col = folderClr(node.folder);
    const radius = 0.5 + Math.min(deg[node.id] || 0, 12) * 0.17;

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 18, 14),
      getMat(col)
    );
    mesh.position.copy(positions[node.id]);
    mesh.userData = { node, col, radius, breathOffset: idx * 0.41 };
    world.add(mesh);
    nodeMeshes.push(mesh);

    const label = makeLabel(node.name, col);
    label.position.copy(positions[node.id]);
    label.position.y += radius + 1.4;
    world.add(label);
  });

  // Edges
  {
    const verts = [];
    links.forEach(l => {
      if (positions[l.source] && positions[l.target]) {
        verts.push(...positions[l.source].toArray(), ...positions[l.target].toArray());
      }
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    world.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0x1a3355, transparent: true, opacity: 0.5,
    })));
  }

  // Legend
  {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    const folders = [...new Set(nodes.map(n => n.folder))].sort();
    folders.forEach(f => {
      const hex = folderClr(f).toString(16).padStart(6, '0');
      const div = document.createElement('div');
      div.className = 'li';
      div.innerHTML = `<div class="dot" style="background:#${hex}"></div>${f}`;
      el.appendChild(div);
    });
    document.getElementById('stats').textContent = `${nodes.length} notes · ${links.length} links`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Load graph + build
// ─────────────────────────────────────────────────────────────────────────────
prog(10, 'Fetching graph data…');
const graphData = await fetch('graph.json').then(r => r.json());
prog(30, `${graphData.nodes.length} notes · ${graphData.links.length} links — computing layout…`);
await buildScene(graphData);
prog(100, 'Ready!');
setTimeout(() => {
  const ov = document.getElementById('overlay');
  ov.style.opacity = '0';
  setTimeout(() => ov.remove(), 850);
}, 350);

// ─────────────────────────────────────────────────────────────────────────────
// SSE — live reload when vault changes
// ─────────────────────────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource('/events');
  es.addEventListener('graph_update', async () => {
    console.log('[VR Brain] Graph updated — reloading…');
    try {
      const fresh = await fetch('graph.json?t=' + Date.now()).then(r => r.json());
      await buildScene(fresh);
    } catch(e) {
      console.warn('Graph reload failed:', e);
    }
  });
  es.onerror = () => {
    setTimeout(connectSSE, 3000); // reconnect on drop
  };
}
connectSSE();

// ─────────────────────────────────────────────────────────────────────────────
// Note content panel
// ─────────────────────────────────────────────────────────────────────────────
const notePanel = document.getElementById('note-panel');
const noteTitle = document.getElementById('note-title');
const noteBody  = document.getElementById('note-body');

document.getElementById('note-close').addEventListener('click', closeNotePanel);

function closeNotePanel() {
  notePanel.classList.remove('open');
}

async function openNote(node) {
  noteTitle.textContent = `📄 ${node.name}`;
  noteBody.innerHTML = '<em style="color:#334">Loading…</em>';
  notePanel.classList.add('open');
  try {
    const res = await fetch('/content?path=' + encodeURIComponent(node.path));
    if (!res.ok) throw new Error('Not found');
    const { content } = await res.json();
    // Use marked if available, else plaintext
    if (window.marked) {
      noteBody.innerHTML = marked.parse(content);
    } else {
      noteBody.innerHTML = '<pre>' + content.replace(/</g,'&lt;') + '</pre>';
    }
  } catch(e) {
    noteBody.innerHTML = `<em style="color:#844">Could not load note: ${e.message}</em>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Desktop raycasting + selection
// ─────────────────────────────────────────────────────────────────────────────
renderer.domElement.addEventListener('click', e => {
  if (renderer.xr.isPresenting) return;
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length) pickNode(hits[0].object);
  else { clearPick(); closeNotePanel(); }
});

function pickNode(mesh) {
  if (selected) {
    selected.material.emissiveIntensity = 0.45;
    selected.scale.setScalar(1);
  }
  selected = mesh;
  mesh.material.emissiveIntensity = 1.5;
  mesh.scale.setScalar(1.6);
  const nd = mesh.userData.node;
  document.getElementById('iname').textContent = nd.name;
  document.getElementById('ipath').textContent = `📁 ${nd.folder}  ·  ${nd.path}`;
  infoEl.style.display = 'block';
  openNote(nd);
}

function clearPick() {
  if (selected) {
    selected.material.emissiveIntensity = 0.45;
    selected.scale.setScalar(1);
    selected = null;
  }
  infoEl.style.display = 'none';
}

// ─────────────────────────────────────────────────────────────────────────────
// VR controllers + hand models
// ─────────────────────────────────────────────────────────────────────────────
const ctrl0 = renderer.xr.getController(0);
const ctrl1 = renderer.xr.getController(1);
scene.add(ctrl0);
scene.add(ctrl1);

const handFactory = new XRHandModelFactory();
const hand0 = renderer.xr.getHand(0);
const hand1 = renderer.xr.getHand(1);
hand0.add(handFactory.createHandModel(hand0, 'spheres'));
hand1.add(handFactory.createHandModel(hand1, 'spheres'));
scene.add(hand0);
scene.add(hand1);

[ctrl0, ctrl1].forEach(c => {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 0, -15),
  ]);
  c.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x00e5ff, transparent: true, opacity: 0.45,
  })));
  c.addEventListener('selectstart', () => vrSelect(c));
});

// VR select — floating content panel in 3D
const rayMat = new THREE.Matrix4();
let vrPanel = null;
let vrContentPanel = null;

async function vrSelect(ctrl) {
  rayMat.identity().extractRotation(ctrl.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(rayMat);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (!hits.length) return;

  const nd = hits[0].object.userData.node;

  // Small label panel (name + path)
  if (vrPanel) scene.remove(vrPanel);
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 130;
  const cx = cv.getContext('2d');
  cx.fillStyle = 'rgba(2,8,40,.96)';
  cx.fillRect(0, 0, 512, 130);
  cx.strokeStyle = 'rgba(0,229,255,.55)';
  cx.lineWidth = 3;
  cx.strokeRect(2, 2, 508, 126);
  cx.fillStyle = '#00e5ff';
  cx.font = 'bold 44px Arial';
  cx.textAlign = 'center';
  cx.fillText(nd.name, 256, 52);
  cx.fillStyle = '#607888';
  cx.font = '22px Arial';
  cx.fillText(`${nd.folder}  ·  ${nd.path}`, 256, 96);

  const tex = new THREE.CanvasTexture(cv);
  vrPanel = new THREE.Mesh(
    new THREE.PlaneGeometry(4.5, 1.15),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
  );
  vrPanel.position.copy(hits[0].point);
  vrPanel.position.y += 1.9;
  vrPanel.quaternion.copy(camera.quaternion);
  scene.add(vrPanel);

  // Load and show note content in larger VR panel
  if (vrContentPanel) scene.remove(vrContentPanel);
  try {
    const res = await fetch('/content?path=' + encodeURIComponent(nd.path));
    if (res.ok) {
      const { content } = await res.json();
      const lines = content.split('\n').slice(0, 28); // first 28 lines
      const cv2 = document.createElement('canvas');
      cv2.width = 900; cv2.height = 700;
      const cx2 = cv2.getContext('2d');
      cx2.fillStyle = 'rgba(2,8,30,.97)';
      cx2.fillRect(0, 0, 900, 700);
      cx2.strokeStyle = 'rgba(170,0,255,.4)';
      cx2.lineWidth = 2;
      cx2.strokeRect(1, 1, 898, 698);
      cx2.font = 'bold 24px monospace';
      cx2.textAlign = 'left';
      let y = 38;
      for (const line of lines) {
        const trimmed = line.trimEnd();
        // Heading detection
        if (trimmed.startsWith('# ')) {
          cx2.fillStyle = '#00e5ff';
          cx2.font = 'bold 26px system-ui';
          cx2.fillText(trimmed.slice(2), 24, y);
          cx2.font = '20px monospace';
        } else if (trimmed.startsWith('## ')) {
          cx2.fillStyle = '#88ddff';
          cx2.font = 'bold 22px system-ui';
          cx2.fillText(trimmed.slice(3), 24, y);
          cx2.font = '20px monospace';
        } else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          cx2.fillStyle = 'rgba(200,220,255,.7)';
          cx2.font = '20px monospace';
          cx2.fillText('• ' + trimmed.slice(2), 30, y);
        } else if (trimmed === '' || trimmed === '---') {
          cx2.fillStyle = 'rgba(255,255,255,.1)';
          if (trimmed === '---') cx2.fillRect(24, y - 5, 852, 1);
        } else {
          cx2.fillStyle = 'rgba(200,215,230,.75)';
          cx2.font = '20px monospace';
          // Truncate long lines
          const maxW = 852;
          let t = trimmed;
          while (cx2.measureText(t).width > maxW && t.length > 0) t = t.slice(0,-1);
          if (t.length < trimmed.length) t += '…';
          cx2.fillText(t, 24, y);
        }
        y += 24;
        if (y > 680) break;
      }
      const tex2 = new THREE.CanvasTexture(cv2);
      vrContentPanel = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 6.2),
        new THREE.MeshBasicMaterial({ map: tex2, transparent: true, side: THREE.DoubleSide })
      );
      vrContentPanel.position.copy(hits[0].point);
      vrContentPanel.position.y += 5;
      vrContentPanel.quaternion.copy(camera.quaternion);
      scene.add(vrContentPanel);
      setTimeout(() => { if (vrContentPanel) { scene.remove(vrContentPanel); vrContentPanel = null; } }, 12000);
    }
  } catch(e) { /* silent */ }

  setTimeout(() => { if (vrPanel) { scene.remove(vrPanel); vrPanel = null; } }, 12000);
}

// ─────────────────────────────────────────────────────────────────────────────
// VR locomotion
// ─────────────────────────────────────────────────────────────────────────────
const _fwd = new THREE.Vector3();
const _rgt = new THREE.Vector3();
const _up  = new THREE.Vector3(0, 1, 0);

function locomote() {
  const sess = renderer.xr.getSession();
  if (!sess) return;
  const xrCam = renderer.xr.getCamera(camera);
  const speed = 0.1;
  for (const src of sess.inputSources) {
    if (!src.gamepad) continue;
    const ax = src.gamepad.axes;
    const lx = ax[2] ?? 0;
    const ly = ax[3] ?? 0;
    if (src.handedness === 'left') {
      if (Math.abs(lx) > 0.12 || Math.abs(ly) > 0.12) {
        xrCam.getWorldDirection(_fwd);
        _fwd.y = 0;
        if (_fwd.lengthSq() < 0.001) _fwd.set(0, 0, -1);
        _fwd.normalize();
        _rgt.crossVectors(_fwd, _up).normalize();
        world.position.addScaledVector(_fwd,  ly * speed);
        world.position.addScaledVector(_rgt, -lx * speed);
      }
    } else {
      if (Math.abs(ly) > 0.12) world.position.y += ly * speed;
      if (Math.abs(lx) > 0.12) {
        const camWP = new THREE.Vector3();
        xrCam.getWorldPosition(camWP);
        world.position.sub(camWP);
        world.position.applyAxisAngle(_up, lx * 0.025);
        world.position.add(camWP);
        world.rotation.y += lx * 0.025;
      }
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Two-hand pinch → zoom + rotate | Right-hand pinch → grab
// ─────────────────────────────────────────────────────────────────────────────
let prevPinchDist = null, prevRightGrabPos = null, prevHandVec = null;
const _lPinch = new THREE.Vector3(), _rPinch = new THREE.Vector3();
const _handVec = new THREE.Vector3(), _deltaQuat = new THREE.Quaternion();
const PINCH_ENTER = 0.025, PINCH_EXIT = 0.05;
let leftWasPinching = false, rightWasPinching = false;

function handlePinchZoom(frame) {
  if (!frame) return;
  const sess = renderer.xr.getSession();
  if (!sess) return;
  const refSpace = renderer.xr.getReferenceSpace();
  if (!refSpace) return;

  let leftPinching = false, rightPinching = false;
  for (const src of sess.inputSources) {
    if (!src.hand) continue;
    const thumbTip = src.hand.get('thumb-tip');
    const indexTip = src.hand.get('index-finger-tip');
    if (!thumbTip || !indexTip) continue;
    const tPose = frame.getJointPose(thumbTip, refSpace);
    const iPose = frame.getJointPose(indexTip, refSpace);
    if (!tPose || !iPose) continue;
    const tp = tPose.transform.position, ip = iPose.transform.position;
    const dist = Math.hypot(tp.x-ip.x, tp.y-ip.y, tp.z-ip.z);
    const wasP = src.handedness === 'left' ? leftWasPinching : rightWasPinching;
    const pinching = wasP ? dist < PINCH_EXIT : dist < PINCH_ENTER;
    if (src.handedness === 'left') leftWasPinching = pinching;
    else rightWasPinching = pinching;
    const mid = new THREE.Vector3((tp.x+ip.x)/2,(tp.y+ip.y)/2,(tp.z+ip.z)/2);
    if (src.handedness === 'left')  { leftPinching = pinching;  _lPinch.copy(mid); }
    else                            { rightPinching = pinching; _rPinch.copy(mid); }
  }

  if (leftPinching && rightPinching) {
    const d = _lPinch.distanceTo(_rPinch);
    const mid = new THREE.Vector3().addVectors(_lPinch, _rPinch).multiplyScalar(0.5);
    _handVec.copy(_rPinch).sub(_lPinch).normalize();
    if (prevPinchDist !== null && d > 0.01) {
      const factor = d / prevPinchDist;
      const next = world.scale.x * factor;
      if (next > 0.01 && next < 6) world.scale.setScalar(next);
      if (prevHandVec !== null) {
        const dot = _handVec.dot(prevHandVec);
        if (dot < 0.9998 && dot > -0.9998) {
          _deltaQuat.setFromUnitVectors(prevHandVec, _handVec);
          world.position.sub(mid);
          world.position.applyQuaternion(_deltaQuat);
          world.quaternion.premultiply(_deltaQuat);
          world.position.add(mid);
        }
      }
    }
    prevPinchDist = d; prevHandVec = _handVec.clone(); prevRightGrabPos = null;
  } else if (rightPinching && !leftPinching) {
    if (prevRightGrabPos !== null) world.position.add(_rPinch.clone().sub(prevRightGrabPos));
    prevRightGrabPos = _rPinch.clone(); prevPinchDist = null; prevHandVec = null;
  } else {
    prevPinchDist = null; prevRightGrabPos = null; prevHandVec = null;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────────────────────────────────────────────────────────────────────────
// Animation loop
// ─────────────────────────────────────────────────────────────────────────────
let t = 0;
renderer.setAnimationLoop((timestamp, frame) => {
  t += 0.016;
  nodeMeshes.forEach(m => {
    const s = 1 + Math.sin(t * 1.4 + m.userData.breathOffset) * 0.045;
    m.scale.setScalar(m === selected ? 1.6 * s : s);
  });
  accentLight.position.set(Math.sin(t * 0.25) * 35, 20, Math.cos(t * 0.25) * 35);
  locomote();
  handlePinchZoom(frame);
  orbit.enabled = !renderer.xr.isPresenting;
  if (orbit.enabled) orbit.update();
  renderer.render(scene, camera);
});
</script>
</body>
